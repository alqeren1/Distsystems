syntax = "proto3";
package proto;
option go_package = "Auction/proto";

enum BidAckEnum{
    FAIL = 0;
    SUCCESS = 1;
    EXCEPTION = 2;
} 


message Empty{
}

message BidderData{
    int64 amount = 1;
    string bidder_name = 2;
}

message BidAck{
    BidAckEnum ack = 1;
}

message Outcome{
    int64 highest_bid = 1;
    bool auction_ongoing = 2;
    string bidder_name = 3;
}



service Auction{
    rpc Bid (BidderData) returns (BidAck);
    rpc Result (Empty) returns (Outcome);
}


service ReplicationNodes{
    rpc ForwardBid (BidderData) returns (BidAck);
    rpc ForwardResult (Empty) returns (Outcome);
    rpc AcceptedBid (BidderData) returns (Empty);
    rpc StartAuction (Empty) returns (Empty);
    rpc AuctionClosed (Empty) returns (Empty);
}

